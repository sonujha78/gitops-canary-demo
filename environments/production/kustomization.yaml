apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../../base
  - ../../base/secrets
patches:
  - target:
      kind: Deployment
      name: podinfo
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/command
        value:
          - ./podinfo
          - --port=9898
          - --level=info
images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: 6.6.0
